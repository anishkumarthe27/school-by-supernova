# Build and deploy React app to GitHub Pages (free static hosting).
# On push to main, the app is built and deployed; no need to commit /build.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Use repo name as base path so assets load on GitHub Pages (username.github.io/REPO_NAME/)
          CI: false
          PUBLIC_URL: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages returns 404 for paths like /dashboard/students; copy index so SPA routing works
      - name: Copy index for SPA routing
        run: cp build/index.html build/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
